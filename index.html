<!DOCTYPE html>
<html>
<head>
    <title>Adivina el número</title>
</head>
<body>
    <h1>Adivina el número (1-10)</h1>
    <input id="numero">
    <button onclick="jugar()">Intentar</button>
    <p id="resultado"></p>

    <script>
        let secreto = Math.floor(Math.random()*10)+1;

        function jugar() {
            let n = Number(document.getElementById("numero").value);

            if(n === secreto){
                document.getElementById("resultado").innerText =
                "¡Ganaste!";
            } else {
                document.getElementById("resultado").innerText =
                "Intenta de nuevo";
            }
        }
    </script>
</body>
</html>
