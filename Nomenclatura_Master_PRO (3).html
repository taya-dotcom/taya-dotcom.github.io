<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomenclatura Inorgánica Master PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;
  --surface:#1e293b;
  --surface2:#263348;
  --border:#334155;
  --text:#f1f5f9;
  --text2:#94a3b8;
  --green:#22c55e;
  --green-dark:#15803d;
  --red:#ef4444;
  --red-dark:#b91c1c;
  --yellow:#f59e0b;
  --blue:#38bdf8;
  --purple:#a78bfa;
  --radius:14px;
  --radius-sm:10px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.screen{display:none;padding:20px;max-width:700px;margin:auto}
.screen.active{display:block}
h1{font-size:26px;font-weight:700;margin-bottom:6px}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}

/* Menu */
.logo{font-size:40px;margin-bottom:8px;display:block}
.subtitle{color:var(--text2);font-size:14px;margin-bottom:28px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.menu-grid .full{grid-column:1/-1}
.mode-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;cursor:pointer;text-align:left;color:var(--text);
  font-family:inherit;transition:background .15s,border-color .15s;
}
.mode-card:hover{background:var(--surface2);border-color:#475569}
.mode-card .icon{font-size:24px;margin-bottom:8px;display:block}
.mode-card .name{font-size:14px;font-weight:600;display:block;margin-bottom:3px}
.mode-card .hint{font-size:12px;color:var(--text2)}

/* Game */
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.back-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;color:var(--text);font-family:inherit;font-size:13px;cursor:pointer}
.back-btn:hover{background:var(--surface2)}
.mode-pill{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--text2)}
.rank-pill{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--yellow);font-weight:600}

.prog-wrap{background:#0f172a;border-radius:999px;height:5px;margin-bottom:16px}
.prog-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .4s}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.stat-val{font-size:22px;font-weight:700;line-height:1}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:3px}

.combo-strip{
  background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);
  border-radius:var(--radius-sm);padding:6px 14px;font-size:13px;
  color:var(--yellow);font-weight:600;margin-bottom:12px;display:none;
  text-align:center;
}
.combo-strip.show{display:block}

.q-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;margin-bottom:14px;
}
.q-cat{display:inline-block;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.25);
  border-radius:999px;padding:3px 12px;font-size:11px;color:var(--blue);margin-bottom:10px}
.q-label{font-size:13px;color:var(--text2);margin-bottom:8px}
.q-formula{font-size:32px;font-weight:700;letter-spacing:1px;line-height:1.2}

.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.opt-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 12px;cursor:pointer;font-family:inherit;font-size:13px;
  color:var(--text);text-align:left;line-height:1.4;transition:background .1s,border-color .1s;
}
.opt-btn:hover:not(:disabled){background:var(--surface2);border-color:#475569}
.opt-btn.correct{background:rgba(34,197,94,.12)!important;border-color:var(--green)!important;color:var(--green)!important}
.opt-btn.wrong{background:rgba(239,68,68,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
.opt-btn.reveal{background:rgba(245,158,11,.12)!important;border-color:var(--yellow)!important;color:var(--yellow)!important}
.opt-btn:disabled{cursor:default}

.text-wrap{display:flex;gap:8px;margin-bottom:12px}
.text-wrap input{
  flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);font-family:inherit;font-size:14px;
}
.text-wrap input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.1)}
.text-wrap button{
  background:var(--green);border:none;border-radius:var(--radius-sm);
  padding:0 18px;color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
}
.text-wrap button:hover{background:var(--green-dark)}

.feedback{
  border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;
  margin-bottom:10px;display:none;font-weight:500;
}
.feedback.show{display:block}
.feedback.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.feedback.fail{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}

.btn-next{
  width:100%;padding:13px;background:var(--green);border:none;
  border-radius:var(--radius-sm);color:#fff;font-family:inherit;
  font-size:14px;font-weight:600;cursor:pointer;display:none;
}
.btn-next:hover{background:var(--green-dark)}

/* Results */
.final-hero{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:28px;text-align:center;margin-bottom:16px;
}
.final-emoji{font-size:48px;margin-bottom:10px}
.final-score{font-size:36px;font-weight:700;margin-bottom:4px}
.final-msg{font-size:14px;color:var(--text2)}

.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.res-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center}
.res-stat .big{font-size:26px;font-weight:700}
.res-stat .sm{font-size:11px;color:var(--text2);margin-top:4px}

.history-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.history-scroll{max-height:220px;overflow-y:auto}
.h-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.h-item:last-child{border-bottom:none}
.h-formula{font-weight:600;font-size:13px}
.h-name{font-size:12px;color:var(--text2);margin-top:1px}
.h-tag{padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600}
.h-ok{background:rgba(34,197,94,.15);color:var(--green)}
.h-fail{background:rgba(239,68,68,.15);color:var(--red)}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-sec{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 18px;color:var(--text);font-family:inherit;font-size:13px;
  font-weight:500;cursor:pointer;
}
.btn-sec:hover{background:var(--surface2)}
</style>
</head>
<body>

<div id="menu" class="screen active">
  <span class="logo">🧪</span>
  <h1>Nomenclatura Inorgánica</h1>
  <p class="subtitle">Domina la nomenclatura química con práctica interactiva</p>
  <div class="menu-grid">
    <button class="mode-card" onclick="start('adivinar')">
      <span class="icon">🎯</span>
      <span class="name">Adivinar</span>
      <span class="hint">Elige entre 4 opciones</span>
    </button>
    <button class="mode-card" onclick="start('escribir')">
      <span class="icon">✍️</span>
      <span class="name">Escribir</span>
      <span class="hint">Escribe el nombre completo</span>
    </button>
    <button class="mode-card" onclick="start('vf')">
      <span class="icon">⚖️</span>
      <span class="name">Verdadero / Falso</span>
      <span class="hint">Decide si el nombre es correcto</span>
    </button>
    <button class="mode-card" onclick="start('inverso')">
      <span class="icon">🔄</span>
      <span class="name">Inverso</span>
      <span class="hint">Del nombre a la fórmula</span>
    </button>
    <button class="mode-card full" onclick="start('examen')">
      <span class="icon">🏆</span>
      <span class="name">Examen completo</span>
      <span class="hint">Modo mixto · 15 preguntas · todos los tipos</span>
    </button>
  </div>
</div>

<div id="game" class="screen">
  <div class="header-bar">
    <button class="back-btn" onclick="backMenu()">← Menú</button>
    <span class="mode-pill" id="mode-pill"></span>
    <span class="rank-pill" id="rank-pill">⭐ Novato</span>
  </div>
  <div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
  <div class="stats-bar">
    <div class="stat-box"><div class="stat-val" id="g-score">0</div><div class="stat-lbl">Puntos</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--green)" id="g-good">0</div><div class="stat-lbl">Correctas</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--red)" id="g-bad">0</div><div class="stat-lbl">Errores</div></div>
    <div class="stat-box"><div class="stat-val" id="g-timer">20</div><div class="stat-lbl">Tiempo</div></div>
  </div>
  <div class="combo-strip" id="combo-strip">⚡ <span id="combo-text">×2 combo!</span></div>
  <div class="q-card">
    <div class="q-cat" id="q-cat"></div>
    <div class="q-label" id="q-label"></div>
    <div class="q-formula" id="q-formula"></div>
  </div>
  <div class="options-grid" id="choices"></div>
  <div class="text-wrap" id="textZone" style="display:none">
    <input id="ans" placeholder="Escribe el nombre aquí..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button onclick="checkText()">OK</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <button class="btn-next" id="btn-next" onclick="nextQ()">Siguiente →</button>
</div>

<div id="results" class="screen">
  <div class="final-hero">
    <div class="final-emoji" id="final-emoji"></div>
    <div class="final-score" id="final-score"></div>
    <div class="final-msg" id="final-msg"></div>
  </div>
  <div class="res-grid" id="res-grid"></div>
  <div class="history-card">
    <h3 style="margin-bottom:12px">Historial de respuestas</h3>
    <div class="history-scroll" id="history-list"></div>
  </div>
  <div class="actions">
    <button class="btn-sec" onclick="backMenu()">🏠 Menú</button>
    <button class="btn-sec" onclick="restart()">🔄 Repetir</button>
  </div>
</div>

<script>
const data=[
  {f:"NaCl",n:"cloruro de sodio",cat:"Sales"},
  {f:"KBr",n:"bromuro de potasio",cat:"Sales"},
  {f:"MgCl₂",n:"cloruro de magnesio",cat:"Sales"},
  {f:"CaCl₂",n:"cloruro de calcio",cat:"Sales"},
  {f:"AlCl₃",n:"cloruro de aluminio",cat:"Sales"},
  {f:"FeCl₂",n:"cloruro de hierro (II)",cat:"Sales"},
  {f:"FeCl₃",n:"cloruro de hierro (III)",cat:"Sales"},
  {f:"CuSO₄",n:"sulfato de cobre (II)",cat:"Sales"},
  {f:"Na₂SO₄",n:"sulfato de sodio",cat:"Sales"},
  {f:"K₂SO₄",n:"sulfato de potasio",cat:"Sales"},
  {f:"Ca₃(PO₄)₂",n:"fosfato de calcio",cat:"Sales"},
  {f:"Na₂CO₃",n:"carbonato de sodio",cat:"Sales"},
  {f:"CaCO₃",n:"carbonato de calcio",cat:"Sales"},
  {f:"AgNO₃",n:"nitrato de plata",cat:"Sales"},
  {f:"HCl",n:"ácido clorhídrico",cat:"Ácidos"},
  {f:"HBr",n:"ácido bromhídrico",cat:"Ácidos"},
  {f:"HF",n:"ácido fluorhídrico",cat:"Ácidos"},
  {f:"H₂S",n:"ácido sulfhídrico",cat:"Ácidos"},
  {f:"H₂SO₄",n:"ácido sulfúrico",cat:"Ácidos"},
  {f:"H₂SO₃",n:"ácido sulfuroso",cat:"Ácidos"},
  {f:"HNO₃",n:"ácido nítrico",cat:"Ácidos"},
  {f:"HNO₂",n:"ácido nitroso",cat:"Ácidos"},
  {f:"H₃PO₄",n:"ácido fosfórico",cat:"Ácidos"},
  {f:"HClO₄",n:"ácido perclórico",cat:"Ácidos"},
  {f:"HClO₃",n:"ácido clórico",cat:"Ácidos"},
  {f:"HClO₂",n:"ácido cloroso",cat:"Ácidos"},
  {f:"HClO",n:"ácido hipocloroso",cat:"Ácidos"},
  {f:"H₂CO₃",n:"ácido carbónico",cat:"Ácidos"},
  {f:"NaOH",n:"hidróxido de sodio",cat:"Bases"},
  {f:"KOH",n:"hidróxido de potasio",cat:"Bases"},
  {f:"Ca(OH)₂",n:"hidróxido de calcio",cat:"Bases"},
  {f:"Mg(OH)₂",n:"hidróxido de magnesio",cat:"Bases"},
  {f:"Al(OH)₃",n:"hidróxido de aluminio",cat:"Bases"},
  {f:"Fe(OH)₂",n:"hidróxido de hierro (II)",cat:"Bases"},
  {f:"Fe(OH)₃",n:"hidróxido de hierro (III)",cat:"Bases"},
  {f:"NH₄OH",n:"hidróxido de amonio",cat:"Bases"},
  {f:"CO₂",n:"dióxido de carbono",cat:"Óxidos"},
  {f:"SO₂",n:"dióxido de azufre",cat:"Óxidos"},
  {f:"SO₃",n:"trióxido de azufre",cat:"Óxidos"},
  {f:"NO₂",n:"dióxido de nitrógeno",cat:"Óxidos"},
  {f:"NO",n:"monóxido de nitrógeno",cat:"Óxidos"},
  {f:"N₂O₅",n:"pentóxido de dinitrógeno",cat:"Óxidos"},
  {f:"P₂O₅",n:"pentóxido de difósforo",cat:"Óxidos"},
  {f:"Fe₂O₃",n:"óxido de hierro (III)",cat:"Óxidos"},
  {f:"FeO",n:"óxido de hierro (II)",cat:"Óxidos"},
  {f:"CuO",n:"óxido de cobre (II)",cat:"Óxidos"},
  {f:"Cu₂O",n:"óxido de cobre (I)",cat:"Óxidos"},
  {f:"MgO",n:"óxido de magnesio",cat:"Óxidos"},
  {f:"CaO",n:"óxido de calcio",cat:"Óxidos"},
  {f:"Na₂O",n:"óxido de sodio",cat:"Óxidos"},
  {f:"K₂O",n:"óxido de potasio",cat:"Óxidos"},
  {f:"Al₂O₃",n:"óxido de aluminio",cat:"Óxidos"},
  {f:"ZnO",n:"óxido de zinc",cat:"Óxidos"},
];

const fakes=["ácido fosfórico","óxido de magnesio","hidruro de calcio","cloruro de plata","sulfuro de zinc","nitrato de plomo","carbonato de bario","hidróxido de litio","bromuro de hierro","fluoruro de potasio","sulfato de aluminio","óxido de manganeso","ácido perbrómico","nitrito de calcio","fosfato de amonio"];

let mode="",lastMode="",qi=0,score=0,good=0,bad=0,combo=0,maxCombo=0;
let timeLeft=20,intv=null,answered=false,history=[],queue=[];
const TOTAL=15;

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function buildQueue(m){
  let pool=shuffle(data).slice(0,TOTAL);
  let modes=["adivinar","escribir","vf","inverso"];
  return pool.map((item,i)=>({item,sub:m==="examen"?modes[i%modes.length]:m}));
}

function start(m){
  mode=m;lastMode=m;qi=0;score=0;good=0;bad=0;combo=0;maxCombo=0;history=[];
  queue=buildQueue(m);
  show("game");loadQ();
}

function show(id){
  ["menu","game","results"].forEach(s=>document.getElementById(s).classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function loadQ(){
  clearInterval(intv);answered=false;
  document.getElementById("btn-next").style.display="none";
  let fb=document.getElementById("feedback");fb.classList.remove("show","ok","fail");
  document.getElementById("textZone").style.display="none";
  document.getElementById("choices").innerHTML="";

  let {item,sub}=queue[qi];
  let mNames={adivinar:"Adivinar",escribir:"Escribir",vf:"Verdadero / Falso",inverso:"Inverso",examen:"Examen"};
  document.getElementById("mode-pill").textContent=mNames[mode]+(mode==="examen"?" · "+mNames[sub]:"");
  document.getElementById("prog-bar").style.width=((qi/TOTAL)*100)+"%";
  document.getElementById("q-cat").textContent=item.cat;

  if(sub==="adivinar"){
    document.getElementById("q-label").textContent="¿Cómo se llama?";
    document.getElementById("q-formula").textContent=item.f;
    buildChoices(item,false);
  }else if(sub==="escribir"){
    document.getElementById("q-label").textContent="Escribe el nombre de:";
    document.getElementById("q-formula").textContent=item.f;
    document.getElementById("textZone").style.display="flex";
    document.getElementById("ans").value="";
    setTimeout(()=>document.getElementById("ans").focus(),80);
  }else if(sub==="vf"){
    let esVerdadero=Math.random()>.45;
    let shown;
    if(esVerdadero){
      shown=item.n;
    }else{
      let idx=Math.floor(Math.random()*fakes.length);
      shown=fakes[idx];
      while(shown===item.n){idx=(idx+1)%fakes.length;shown=fakes[idx];}
    }
    document.getElementById("q-label").textContent="¿Es correcto este nombre?";
    document.getElementById("q-formula").textContent=item.f+" = "+shown;
    let g=document.getElementById("choices");
    g.style.gridTemplateColumns="1fr 1fr";
    ["Verdadero","Falso"].forEach(x=>{
      let b=document.createElement("button");
      b.className="opt-btn";b.textContent=x;
      b.onclick=()=>{
        if(answered)return;answered=true;clearInterval(intv);
        let ok=(esVerdadero&&x==="Verdadero")||(!esVerdadero&&x==="Falso");
        b.classList.add(ok?"correct":"wrong");
        document.querySelectorAll(".opt-btn").forEach(btn=>btn.disabled=true);
        let reason=ok?"":esVerdadero
          ?"Era VERDADERO — el nombre es: "+item.n
          :"Era FALSO — '"+shown+"' es incorrecto. El nombre correcto es: "+item.n;
        handleResult(ok,item,reason);
      };
      g.appendChild(b);
    });
  }else if(sub==="inverso"){
    document.getElementById("q-label").textContent="¿Cuál es la fórmula de?";
    document.getElementById("q-formula").textContent=item.n;
    buildChoices(item,true);
  }
  updateHUD();startTimer(sub);
}

function buildChoices(item,inv){
  let pool=shuffle(data.filter(d=>d!==item)).slice(0,3).map(d=>inv?d.f:d.n);
  let correct=inv?item.f:item.n;
  let opts=shuffle([correct,...pool]);
  let g=document.getElementById("choices");
  g.style.gridTemplateColumns="1fr 1fr";
  opts.forEach(o=>{
    let b=document.createElement("button");b.className="opt-btn";b.textContent=o;
    b.onclick=()=>{
      if(answered)return;answered=true;clearInterval(intv);
      let ok=o===correct;
      b.classList.add(ok?"correct":"wrong");
      if(!ok)document.querySelectorAll(".opt-btn").forEach(btn=>{if(btn.textContent===correct)btn.classList.add("reveal");});
      document.querySelectorAll(".opt-btn").forEach(btn=>btn.disabled=true);
      handleResult(ok,item,ok?"":"Correcto: "+correct);
    };
    g.appendChild(b);
  });
}

function startTimer(sub){
  let limit=sub==="escribir"?30:20;
  timeLeft=limit;
  document.getElementById("g-timer").textContent=timeLeft;
  document.getElementById("g-timer").style.color="var(--text)";
  intv=setInterval(()=>{
    timeLeft--;
    document.getElementById("g-timer").textContent=timeLeft;
    if(timeLeft<=5)document.getElementById("g-timer").style.color="var(--red)";
    if(timeLeft<=0){
      clearInterval(intv);
      if(!answered){answered=true;bad++;combo=0;history.push({f:queue[qi].item.f,n:queue[qi].item.n,ok:false});showFeedback(false,"⏰ Tiempo agotado — era: "+queue[qi].item.n);document.getElementById("btn-next").style.display="block";}
    }
  },1000);
}

function checkText(){
  if(answered)return;
  let val=document.getElementById("ans").value.trim().toLowerCase();
  let ok=queue[qi].item.n.toLowerCase();
  let isOk=val===ok||(ok.split("/").some(p=>p.trim()===val));
  answered=true;clearInterval(intv);
  handleResult(isOk,queue[qi].item,isOk?"":"Correcto: "+queue[qi].item.n);
}

function handleResult(ok,item,reason){
  if(ok){combo++;good++;let pts=10+(combo>2?5:0)+(timeLeft>15?5:0);score+=pts;maxCombo=Math.max(maxCombo,combo);showFeedback(true,"✓ Correcto!"+(combo>1?" ×"+combo+" combo! +"+pts+"pts":"")); }
  else{combo=0;bad++;showFeedback(false,"✗ "+(reason||"Incorrecto"));}
  history.push({f:item.f,n:item.n,ok});
  updateHUD();
  document.getElementById("btn-next").style.display="block";
  let cs=document.getElementById("combo-strip");
  if(combo>1){cs.classList.add("show");document.getElementById("combo-text").textContent="×"+combo+" combo!";}
  else cs.classList.remove("show");
}

function showFeedback(ok,msg){
  let fb=document.getElementById("feedback");
  fb.textContent=msg;fb.classList.add("show",ok?"ok":"fail");
}

function updateHUD(){
  document.getElementById("g-score").textContent=score;
  document.getElementById("g-good").textContent=good;
  document.getElementById("g-bad").textContent=bad;
  let r="Novato";
  if(score>30)r="Aprendiz";if(score>80)r="Competente";if(score>140)r="Experto";if(score>200)r="Maestro";
  document.getElementById("rank-pill").textContent="⭐ "+r;
}

function nextQ(){qi++;if(qi>=TOTAL)finish();else loadQ();}

function finish(){
  clearInterval(intv);
  let pct=Math.round((good/TOTAL)*100);
  let emoji="🌱",msg="Sigue practicando, lo vas a lograr.";
  if(pct>=90){emoji="🏆";msg="Dominio excelente de la nomenclatura.";}
  else if(pct>=70){emoji="💪";msg="Muy buen trabajo, sigue así.";}
  else if(pct>=50){emoji="📚";msg="Buen intento, con más práctica lo dominas.";}
  document.getElementById("final-emoji").textContent=emoji;
  document.getElementById("final-score").textContent=score+" puntos";
  document.getElementById("final-msg").textContent=msg;
  document.getElementById("res-grid").innerHTML=`
    <div class="res-stat"><div class="big">${pct}%</div><div class="sm">Precisión</div></div>
    <div class="res-stat"><div class="big" style="color:var(--green)">${good}</div><div class="sm">Correctas</div></div>
    <div class="res-stat"><div class="big" style="color:var(--red)">${bad}</div><div class="sm">Errores</div></div>
    <div class="res-stat"><div class="big" style="color:var(--yellow)">${maxCombo}</div><div class="sm">Combo máx</div></div>
  `;
  document.getElementById("history-list").innerHTML=history.map(h=>`
    <div class="h-item">
      <div><div class="h-formula">${h.f}</div><div class="h-name">${h.n}</div></div>
      <span class="h-tag ${h.ok?"h-ok":"h-fail"}">${h.ok?"✓":"✗"}</span>
    </div>
  `).join("");
  show("results");
}

function restart(){start(lastMode);}
function backMenu(){clearInterval(intv);show("menu");}
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(document.getElementById("textZone").style.display!=="none")checkText();
    else if(document.getElementById("btn-next").style.display!=="none")nextQ();
  }
});
</script>
</body>
</html>
